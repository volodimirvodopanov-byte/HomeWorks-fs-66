<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Умный холодильник</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">
    <h1>Умный холодильник</h1>
    <p class="subtitle">Список покупок и помощник, который подскажет, чего не хватает для блюда.</p>

    <!-- ===== Список покупок ===== -->
    <section class="section">
      <h2 class="section__title">Список покупок</h2>

      <form id="addForm" class="add-form">
        <div class="field">
          <label for="productName">Название</label>
          <input id="productName" name="productName" type="text" placeholder="Морковь" autocomplete="off">
        </div>

        <div class="field">
          <label for="productCategory">Категория</label>
          <!-- Варианты создаёт renderCategoryOptions() из CATEGORIES в config.js -->
          <select id="productCategory" name="productCategory"></select>
        </div>

        <button type="submit">Добавить</button>
      </form>

      <!-- data-filter совпадает со значениями FILTERS в config.js -->
      <div class="toolbar" id="filters">
        <button type="button" class="button-secondary" data-filter="all">Все</button>
        <button type="button" class="button-secondary" data-filter="toBuy">Нужно купить</button>
        <button type="button" class="button-secondary" data-filter="bought">Куплено</button>
      </div>

      <div class="toolbar">
        <button type="button" class="button-secondary" id="createDraft">Создать черновик</button>
        <button type="button" id="saveDraft" hidden>Сохранить изменения</button>
        <button type="button" class="button-secondary" id="cancelDraft" hidden>Отменить изменения</button>
      </div>

      <p class="draft-badge" id="draftBadge" hidden>Черновик: изменения не сохранены</p>

      <ul class="products" id="productList"></ul>
    </section>

    <!-- ===== Помощник AI ===== -->
    <section class="section">
      <h2 class="section__title">Что докупить для блюда</h2>

      <form id="searchForm">
        <div class="field">
          <label for="userName">Имя пользователя</label>
          <input id="userName" name="userName" type="text" placeholder="John или Bill" autocomplete="off">
        </div>

        <div class="field">
          <label for="dishTitle">Название блюда</label>
          <input id="dishTitle" name="dishTitle" type="text" placeholder="борщ" autocomplete="off">
        </div>

        <button id="searchButton" type="submit">Найти недостающие</button>
      </form>

      <p class="role-badge" id="roleBadge"></p>
      <pre class="result" id="result"></pre>
    </section>
  </main>

  <dialog class="modal" id="errorModal" aria-labelledby="errorTitle">
    <h2 class="modal__title" id="errorTitle">Ошибка</h2>
    <p class="modal__text" id="errorMessage"></p>
    <button type="button" id="closeModal">Закрыть</button>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
